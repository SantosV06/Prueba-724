name: Validate application
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: vne_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d vne_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Disposable local PGLite only. These are public test credentials, never production secrets.
      ADMIN_PASSWORD: ci-test-only-password-724
      E2E_ADMIN_PASSWORD: ci-test-only-password-724
      ADMIN_SESSION_SECRET: ci-test-only-session-secret-at-least-32-characters
      E2E_LOCAL_DATABASE: "true"
      E2E_TOTP_ENABLED: "true"
      ADMIN_TOTP_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      # Official Cloudflare Turnstile test keys; never use these in production.
      VITE_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
      TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Verify against disposable PostgreSQL
        run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/vne_test
      - run: npm run build
      - name: Configure browser
        timeout-minutes: 3
        run: |
          vne_chrome_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$vne_chrome_path" ]; then
            printf 'BROWSER_EXECUTABLE_PATH=%s\n' "$vne_chrome_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Start isolated development server
        run: |
          npm run dev > /tmp/vne-dev.log 2>&1 &
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/vne-dev.log
          exit 1
      - run: npm run test:e2e
      - run: npm run preview:restart
      - run: npm run test:e2e -- http://127.0.0.1:8081 --built
