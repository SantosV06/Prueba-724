name: Check production availability
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
concurrency:
  group: production-availability
  cancel-in-progress: false
jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check homepage and database health
        env:
          SITE: ${{ vars.MONITOR_SITE_URL || 'https://prueba-724.vercel.app' }}
        run: node scripts/availability-check.mjs
